<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Executive Training | Asime Partners</title>
    <meta
      name="description"
      content="Executive training from Asime Partners: investor education, advanced master classes, and customised curricula for institutional investors."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/new1.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/new1.png" />
    <style>
      #wf-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #000;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #wf-preloader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .wf-preloader-mark {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
      }
      .wf-preloader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #fff;
        border-right-color: rgba(255, 255, 255, 0.45);
        animation: wf-preloader-spin 0.9s linear infinite;
      }
      #wf-preloader img {
        width: 44px;
        height: 44px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        animation: wf-preloader-pulse 1.1s ease-in-out infinite;
      }
      @keyframes wf-preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes wf-preloader-pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .wf-preloader-ring,
        #wf-preloader img { animation: none; }
        .wf-preloader-ring {
          border-color: rgba(255, 255, 255, 0.35);
        }
      }
    </style>
  </head>
  <body>
    <div id="wf-preloader" aria-hidden="true">
      <div class="wf-preloader-mark">
        <span class="wf-preloader-ring" aria-hidden="true"></span>
        <img src="/new1.png" alt="" width="44" height="44" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/training.tsx"></script>
  </body>
</html>
